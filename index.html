<style>
/* Layout: glass top bar · dark teal hero with a self-playing phone booking · floating feature band · pain map · back office = deep-green sidebar + working canvas */
:root {
  --bg: #F2F6F5; --surface: #FFFFFF; --sunk: #E8F0EE; --ink: #0D1F1E; --muted: #56706C; --line: #D9E5E2;
  --brand: #0B7C6E; --brand-ink: #FFFFFF; --brand-soft: #DCF2ED;
  --coral: #E05A35; --coral-soft: #FDE6DD;
  --aqua: #3B6FD8; --aqua-soft: #E3EBFB;
  --ok: #0E8A68; --ok-soft: #DCF3EA; --warn: #A3650C; --warn-soft: #FCEFD8; --bad: #CC3B2E; --bad-soft: #FCE4E1; --gold: #B07D10; --gold-soft: #F8ECC9;
  --fig: #CFE0DC; --av-bg: 92%; --av-fg: 30%;
  --shadow: 0 1px 2px rgb(13 31 30 / .06), 0 10px 30px -14px rgb(13 31 30 / .22);
  --shadow-lg: 0 30px 60px -28px rgb(13 31 30 / .35);
  /* the hero, sidebar and footer are dark in both themes */
  --navy: #06201E; --navy-2: #0B302D; --on-navy: #ECF7F4; --on-navy-muted: #97B6B0; --glass: rgb(255 255 255 / .08); --glass-line: rgb(255 255 255 / .16);
  --aur-1: #12A58E; --aur-2: #F2884B; --grad-text-a: #7EE8D2; --grad-text-b: #FFC08A; --wa: #25D366;
  --f-display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08110F; --surface: #0F1B19; --sunk: #152522; --ink: #E5F1EE; --muted: #8FAAA5; --line: #1F332F;
  --brand: #4FD1B9; --brand-ink: #08110F; --brand-soft: #113B34; --coral: #FF8A65; --coral-soft: #3F1F16; --aqua: #8AAEFF; --aqua-soft: #1B2A4D;
  --ok: #43CFA0; --ok-soft: #10342A; --warn: #E9B04F; --warn-soft: #3A2A10; --bad: #F2846F; --bad-soft: #3E1D19; --gold: #E7BE52; --gold-soft: #3A2F12;
  --fig: #29403C; --av-bg: 24%; --av-fg: 82%;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px -14px rgb(0 0 0 / .7); --shadow-lg: 0 30px 60px -28px rgb(0 0 0 / .8);
  --navy: #040D0C; --navy-2: #0A1E1C; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #08110F; --surface: #0F1B19; --sunk: #152522; --ink: #E5F1EE; --muted: #8FAAA5; --line: #1F332F;
  --brand: #4FD1B9; --brand-ink: #08110F; --brand-soft: #113B34; --coral: #FF8A65; --coral-soft: #3F1F16; --aqua: #8AAEFF; --aqua-soft: #1B2A4D;
  --ok: #43CFA0; --ok-soft: #10342A; --warn: #E9B04F; --warn-soft: #3A2A10; --bad: #F2846F; --bad-soft: #3E1D19; --gold: #E7BE52; --gold-soft: #3A2F12;
  --fig: #29403C; --av-bg: 24%; --av-fg: 82%;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px -14px rgb(0 0 0 / .7); --shadow-lg: 0 30px 60px -28px rgb(0 0 0 / .8);
  --navy: #040D0C; --navy-2: #0A1E1C; color-scheme: dark }
:lang(ar) { --f-display: "Readex Pro", system-ui, sans-serif; --f-body: "Readex Pro", system-ui, sans-serif; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.12; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter: saturate(1.8) blur(16px); -webkit-backdrop-filter: saturate(1.8) blur(16px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; height: 62px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 1.02rem; letter-spacing: -.01em; white-space: nowrap; }
.logo { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--aur-1), var(--aur-2)); box-shadow: 0 6px 16px -6px var(--aur-1); flex: none; }
.demo-tag { font: 700 .62rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; background: var(--warn-soft); color: var(--warn); }
.links { display: flex; gap: 4px; margin-inline-start: 18px; }
.links a { text-decoration: none; font-weight: 600; font-size: .9rem; color: var(--muted); padding: 7px 11px; border-radius: 8px; white-space: nowrap; }
.links a:hover { color: var(--ink); background: var(--sunk); }
@media (max-width: 1200px) { .links { display: none; } }
.spacer { margin-inline-start: auto; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; flex: none; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: .84rem; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 15px; border-radius: 10px; font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); box-shadow: 0 8px 20px -10px var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ok { color: var(--ok); } .btn.bad { color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: .8rem; border-radius: 8px; }
.btn.lg { padding: 14px 22px; font-size: 1rem; border-radius: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.glow { border: 0; color: #fff; background: linear-gradient(135deg, var(--aur-1), var(--aur-2)); box-shadow: 0 14px 34px -12px var(--aur-1); }
.btn.glass { background: var(--glass); border-color: var(--glass-line); color: var(--on-navy); backdrop-filter: blur(10px); }
.btn.glass:hover { border-color: rgb(255 255 255 / .35); }
[dir="rtl"] .flip { transform: scaleX(-1); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-confirmed { background: var(--brand-soft); color: var(--brand); }
.st-pending { background: var(--warn-soft); color: var(--warn); }
.st-done { background: var(--ok-soft); color: var(--ok); }
.st-noshow, .st-cancelled { background: var(--bad-soft); color: var(--bad); }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; isolation: isolate; background: var(--navy); color: var(--on-navy); }
.hero::before, .hero::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; filter: blur(70px); pointer-events: none; }
.hero::before { width: 720px; height: 720px; top: -260px; inset-inline-end: -160px; background: radial-gradient(circle, color-mix(in srgb, var(--aur-1) 65%, transparent), transparent 65%); }
.hero::after { width: 620px; height: 620px; bottom: -320px; inset-inline-start: -180px; background: radial-gradient(circle, color-mix(in srgb, var(--aur-2) 45%, transparent), transparent 65%); }
.gridbg { position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(rgb(255 255 255 / .045) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .045) 1px, transparent 1px); background-size: 46px 46px; -webkit-mask-image: radial-gradient(ellipse 70% 70% at 70% 40%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse 70% 70% at 70% 40%, #000 20%, transparent 75%); }
.hero .wrap { display: grid; grid-template-columns: 1.08fr .92fr; gap: 32px; padding-block: 76px 110px; align-items: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: .82rem; font-weight: 600; background: var(--glass); border: 1px solid var(--glass-line); padding: 6px 14px 6px 10px; border-radius: 999px; margin-bottom: 22px; }
.eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--wa); box-shadow: 0 0 0 0 var(--wa); }
.hero h1 { font-size: clamp(2.5rem, 5.6vw, 4.4rem); font-weight: 800; letter-spacing: -.04em; line-height: 1.02; }
.hero h1 i, .h-sec i { font-family: var(--f-serif); font-weight: 400; font-style: italic; letter-spacing: -.01em; padding-inline-end: .08em; margin-inline-end: -.1em; }
.hero h1 i { background: linear-gradient(95deg, var(--grad-text-a), var(--grad-text-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
:lang(ar) .hero h1, :lang(ar) .h-sec { letter-spacing: 0; line-height: 1.3; }
:lang(ar) .hero h1 i, :lang(ar) .h-sec i { font-family: var(--f-display); font-style: normal; font-weight: 700; }
.hero .lead { font-size: 1.14rem; color: var(--on-navy-muted); max-width: 48ch; margin: 22px 0 30px; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
.trust { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 30px; font-size: .88rem; color: var(--on-navy-muted); }
.trust span { display: inline-flex; align-items: center; gap: 7px; }
.trust b { color: var(--on-navy); font-weight: 600; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--wa); flex: none; }
.live.off { background: #F2846F; }

.stage { position: relative; min-height: 600px; display: grid; place-items: center; }
.phone { --pw: 268px; width: var(--pw); font-size: calc(var(--pw) / 20); aspect-ratio: 9 / 18.6; border-radius: 3em; padding: .55em; background: linear-gradient(160deg, #1A2E2C, #050E0D); box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .14), 0 50px 90px -30px rgb(0 0 0 / .75), 0 0 0 1px rgb(0 0 0 / .4); position: relative; transform: rotate(-3deg); }
[dir="rtl"] .phone { transform: rotate(3deg); }
.notch { position: absolute; top: 1.05em; left: 50%; translate: -50% 0; width: 5.6em; height: 1.55em; border-radius: 1em; background: #050E0D; z-index: 3; }
.screen { position: relative; height: 100%; border-radius: 2.5em; overflow: hidden; background: var(--surface); color: var(--ink); padding: 3.3em 1.15em 1em; display: flex; flex-direction: column; gap: .55em; text-align: start; }
.pm-top { display: flex; align-items: center; gap: .5em; font-size: .9em; font-weight: 700; }
.pm-top .logo { width: 1.9em; height: 1.9em; border-radius: .6em; box-shadow: none; }
.pm-h { font: 800 1.45em/1.15 var(--f-display); letter-spacing: -.02em; margin: .25em 0 .1em; }
.pm-l { font-size: .72em; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: .35em; }
:lang(ar) .pm-l { letter-spacing: 0; }
.pm-chips, .pm-days, .pm-slots { display: flex; flex-wrap: wrap; gap: .4em; }
.pm-chip, .pm-day, .pm-slot { border: 1px solid var(--line); border-radius: .7em; font-size: .8em; padding: .45em .7em; font-weight: 600; transition: background .3s, color .3s, border-color .3s, transform .3s; position: relative; }
.pm-days { flex-wrap: nowrap; }
.pm-day { flex: 1; display: grid; justify-items: center; padding: .4em 0; line-height: 1.15; }
.pm-day small { font-size: .78em; color: var(--muted); font-weight: 500; }
.pm-day b { font-size: 1.2em; }
.pm-slots { display: grid; grid-template-columns: repeat(3, 1fr); }
.pm-slot { text-align: center; font-family: var(--f-mono); padding: .45em 0; }
.pm-slot.off { opacity: .35; text-decoration: line-through; }
.pm-chip.sel, .pm-day.sel, .pm-slot.sel { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.pm-day.sel small { color: inherit; }
.pm-btn { position: relative; margin-top: auto; text-align: center; background: var(--brand); color: var(--brand-ink); border-radius: .9em; padding: .85em; font-weight: 700; font-size: .92em; opacity: .55; transition: opacity .3s, transform .2s; }
.pm-btn.sel { opacity: 1; }
.tap::after { content: ""; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid var(--brand); animation: tap .9s ease-out both; pointer-events: none; }
.pm-btn.tap { transform: scale(.96); }
@keyframes tap { from { opacity: 1; transform: scale(.9); } to { opacity: 0; transform: scale(1.25); } }
.pm-done { position: absolute; inset: 0; background: var(--surface); display: grid; place-content: center; justify-items: center; gap: .5em; text-align: center; padding: 1.5em; opacity: 0; transform: scale(.96); transition: opacity .35s, transform .35s; pointer-events: none; }
.phone.done .pm-done { opacity: 1; transform: none; }
.pm-done b { font: 800 1.35em/1.2 var(--f-display); }
.pm-done span { font-size: .9em; color: var(--muted); }
.pm-done small { font-size: .78em; color: var(--ok); background: var(--ok-soft); padding: .35em .8em; border-radius: 999px; font-weight: 600; margin-top: .4em; }
.check { width: 64px; height: 64px; }
.check circle { fill: var(--ok); }
.check path { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; }

.float { position: absolute; z-index: 2; background: rgb(12 44 40 / .55); border: 1px solid var(--glass-line); color: var(--on-navy); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-radius: 18px; padding: 13px 15px; box-shadow: 0 24px 50px -24px rgb(0 0 0 / .7); display: grid; gap: 7px; font-size: .84rem; }
.float b { font-size: .9rem; }
.float .r { display: flex; align-items: center; gap: 10px; }
.float .sub { color: var(--on-navy-muted); font-size: .8rem; }
.fa { top: 84px; inset-inline-start: -6px; width: 228px; }
.fb { bottom: 64px; inset-inline-end: -14px; width: 262px; }
.fc { top: 22px; inset-inline-end: 0; width: 200px; }
.fc svg.spk { width: 100%; height: 34px; }
.gi { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; background: rgb(255 255 255 / .1); }
.gi.ok { background: color-mix(in srgb, var(--wa) 25%, transparent); color: #7CF0AE; }
.gi.wa { background: var(--wa); color: #fff; }
.gi.coral { background: rgb(242 136 75 / .22); color: #FFB48A; }
.bubble { background: color-mix(in srgb, var(--wa) 18%, transparent); border: 1px solid color-mix(in srgb, var(--wa) 30%, transparent); border-radius: 14px 14px 14px 4px; padding: 9px 11px; font-size: .8rem; line-height: 1.4; }
[dir="rtl"] .bubble { border-radius: 14px 14px 4px 14px; }

/* ---------- feature band ---------- */
.band { position: relative; z-index: 2; margin-top: -54px; }
.band-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-lg); display: grid; grid-template-columns: repeat(4, 1fr); }
.feat { display: flex; gap: 14px; align-items: center; padding: 22px; }
.feat + .feat { border-inline-start: 1px solid var(--line); }
.feat b { display: block; font-size: .95rem; }
.feat span { color: var(--muted); font-size: .82rem; }
.fi { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--brand-soft); color: var(--brand); }
.fi.a { background: var(--aqua-soft); color: var(--aqua); }
.fi.c { background: var(--coral-soft); color: var(--coral); }
.fi.k { background: var(--ok-soft); color: var(--ok); }

/* ---------- sections ---------- */
.sec { padding-block: 96px; }
.sec.alt { background: var(--surface); border-block: 1px solid var(--line); }
.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); margin-bottom: 14px; }
.kicker::before { content: ""; width: 22px; height: 2px; background: currentColor; border-radius: 2px; }
:lang(ar) .kicker { letter-spacing: 0; }
.h-sec { font-size: clamp(1.9rem, 3.6vw, 2.9rem); font-weight: 800; letter-spacing: -.035em; }
.h-sec i { color: var(--brand); }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 36px; flex-wrap: wrap; }
.sec-head p { max-width: 44ch; }

.services { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.svc { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: grid; gap: 14px; text-align: start; transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s, border-color .3s; }
.svc::before { content: ""; position: absolute; inset: auto -30% -60% auto; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, var(--brand-soft), transparent 70%); opacity: 0; transition: opacity .3s; }
.svc:hover { transform: translateY(-6px); border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); box-shadow: var(--shadow-lg); }
.svc:hover::before { opacity: 1; }
.svc .si { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; background: hsl(var(--h) 70% var(--av-bg)); color: hsl(var(--h) 60% var(--av-fg)); transition: transform .3s; }
.svc:hover .si { transform: rotate(-6deg) scale(1.06); }
.svc h3 { font-size: 1.08rem; }
.svc p { font-size: .84rem; color: var(--muted); }
.svc .meta { display: flex; justify-content: space-between; align-items: center; font-size: .84rem; color: var(--muted); padding-top: 12px; border-top: 1px dashed var(--line); margin-top: auto; }
.svc .price { color: var(--ink); font-weight: 700; }
.svc .go { display: inline-flex; align-items: center; gap: 4px; font-size: .82rem; font-weight: 700; color: var(--brand); }

/* pain map */
.pain-grid { display: grid; grid-template-columns: .95fr 1.05fr; gap: 56px; align-items: center; }
.body-card { position: relative; border-radius: 28px; background: radial-gradient(110% 80% at 50% 0%, var(--brand-soft), var(--sunk)); border: 1px solid var(--line); padding: 26px 20px 18px; display: grid; justify-items: center; gap: 14px; }
.body-card svg.body { width: min(250px, 70%); height: auto; overflow: visible; }
.fig { fill: var(--fig); }
.limb { fill: none; stroke: var(--fig); stroke-linecap: round; stroke-linejoin: round; stroke-width: 17; }
.limb.leg { stroke-width: 24; }
.zone { cursor: pointer; outline: none; }
.zone .halo { fill: var(--brand); opacity: .16; transition: opacity .2s; }
.zone .dot { fill: var(--brand); stroke: var(--surface); stroke-width: 2.5; transition: fill .2s; }
.zone:hover .halo, .zone:focus-visible .halo { opacity: .35; }
.zone.on .dot { fill: var(--coral); }
.zone.on .halo { fill: var(--coral); opacity: .3; }
.hl { fill: var(--coral); }
.hl-halo { fill: var(--coral); opacity: .25; }
.zone-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.zone-chips .chip { font-size: .78rem; padding: 6px 10px; }
.pain-info { display: grid; gap: 18px; }
.zcard { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.zhead { display: flex; align-items: center; gap: 12px; }
.zhead .fi { background: var(--coral-soft); color: var(--coral); }
.zhead b { font: 800 1.25rem/1.2 var(--f-display); }
.reco { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.reco div { background: var(--sunk); border-radius: 14px; padding: 12px 14px; }
.reco small { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); }
.reco b { font-size: .98rem; }
.eva-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.eva-val { font: 800 2rem/1 var(--f-display); }
.eva-lbl { font-weight: 700; }
input.eva { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; border-radius: 999px; background: linear-gradient(90deg, #2BB673, #F2C94C 45%, #F2994A 70%, #EB5757); outline: none; margin: 6px 0 2px; }
input.eva::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); box-shadow: 0 4px 12px rgb(0 0 0 / .25); cursor: pointer; }
input.eva::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); cursor: pointer; }
.eva-scale { display: flex; justify-content: space-between; font: 600 .72rem var(--f-mono); color: var(--muted); }
.alert { display: flex; gap: 10px; align-items: start; background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: .86rem; font-weight: 600; }

/* cabinet */
.cab-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px; min-width: 0; }
.dr { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: start; }
.dr-photo { width: 120px; height: 140px; border-radius: 22px; background: linear-gradient(150deg, var(--aur-1), var(--aur-2)); display: grid; place-items: center; color: #fff; position: relative; overflow: hidden; }
.dr-photo::after { content: ""; position: absolute; inset: auto -20% -40% -20%; height: 70%; border-radius: 50% 50% 0 0; background: rgb(255 255 255 / .18); }
.dr-photo svg { position: relative; z-index: 1; }
.dr h3 { font-size: 1.35rem; }
.perks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; grid-column: 1 / -1; }
.perk { display: inline-flex; align-items: center; gap: 7px; font-size: .84rem; font-weight: 600; padding: 8px 12px; border-radius: 12px; background: var(--sunk); }
.perk svg { color: var(--brand); }
.side-stack { display: grid; gap: 20px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
.status.off { background: var(--bad-soft); color: var(--bad); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.hours { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: 14px; }
.hours td { padding: 8px 0; border-bottom: 1px solid var(--line); }
.hours tr:last-child td { border-bottom: 0; }
.hours td:last-child { text-align: end; }
.hours tr.today td { font-weight: 700; color: var(--brand); }
.map { position: relative; height: 190px; border-radius: 16px; overflow: hidden; background: var(--sunk); margin-top: 14px; }
.map svg { width: 100%; height: 100%; display: block; }
.map .road { stroke: var(--surface); }
.map .avenue { stroke: var(--surface); stroke-width: 16; }
.map .park { fill: var(--brand-soft); }
.map .block { fill: color-mix(in srgb, var(--line) 60%, var(--sunk)); }
.map text { font: 700 11px var(--f-body); fill: var(--muted); }
.pin { position: absolute; left: 56%; top: 38%; translate: -50% -100%; color: var(--coral); filter: drop-shadow(0 6px 8px rgb(0 0 0 / .25)); }

/* booking */
.book { display: grid; grid-template-columns: 1.45fr .85fr; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; overflow: hidden; box-shadow: var(--shadow-lg); }
.book-main { padding: 30px; min-width: 0; }
.steps { display: grid; gap: 4px; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding-block: 16px; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .82rem; background: var(--sunk); color: var(--muted); transition: background .3s, color .3s; }
.step.ok .num { background: var(--ok); color: #fff; }
.step.cur .num { background: var(--brand); color: var(--brand-ink); }
.step-b { display: grid; gap: 10px; min-width: 0; }
.step-t { font-weight: 700; font-size: .95rem; padding-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 8px 13px; font-size: .86rem; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.chip:hover { border-color: var(--brand); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.day { flex: none; width: 62px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 9px 4px; text-align: center; line-height: 1.15; display: grid; gap: 2px; }
.day .d { font: 800 1.3rem/1.1 var(--f-display); }
.day small { font-size: .7rem; color: var(--muted); font-weight: 600; text-transform: capitalize; }
.day:hover { border-color: var(--brand); }
.day[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); box-shadow: 0 10px 20px -10px var(--brand); }
.day[aria-pressed="true"] small { color: inherit; opacity: .85; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.slots .chip { justify-content: center; font-family: var(--f-mono); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label.f { display: grid; gap: 5px; font-size: .8rem; font-weight: 700; color: var(--muted); }
.in { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 11px 13px; font-size: .95rem; width: 100%; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.in:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
textarea.in { resize: vertical; min-height: 90px; }
.err { color: var(--bad); font-size: .85rem; font-weight: 600; }
.book-side { position: relative; overflow: hidden; isolation: isolate; background: var(--navy); color: var(--on-navy); padding: 30px; display: flex; flex-direction: column; gap: 18px; }
.book-side::before { content: ""; position: absolute; z-index: -1; width: 380px; height: 380px; border-radius: 50%; top: -160px; inset-inline-end: -140px; background: radial-gradient(circle, color-mix(in srgb, var(--aur-1) 60%, transparent), transparent 65%); filter: blur(30px); }
.sum-row { display: flex; justify-content: space-between; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--glass-line); font-size: .9rem; }
.sum-row span:first-child { color: var(--on-navy-muted); }
.sum-row b { text-align: end; }
.sum-row b.empty { color: var(--on-navy-muted); font-weight: 500; }
.sum-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: auto; padding-top: 6px; }
.sum-total b { font: 800 1.9rem/1 var(--f-display); }
.sum-note { font-size: .8rem; color: var(--on-navy-muted); display: flex; gap: 8px; align-items: start; }
.success { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 30px 10px; }
.success b { font: 800 1.5rem/1.2 var(--f-display); }
.success .muted { max-width: 40ch; }
.linkish { color: var(--brand); font-weight: 700; cursor: pointer; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* faq */
.faq-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: 48px; align-items: start; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 0; font-weight: 700; font-size: 1.02rem; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary .pm { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); transition: transform .3s, background .3s, color .3s; }
.faq details[open] summary .pm { transform: rotate(45deg); background: var(--brand); color: var(--brand-ink); }
.faq details p { padding: 0 0 20px; color: var(--muted); max-width: 62ch; }

.foot { background: var(--navy); color: var(--on-navy-muted); font-size: .86rem; }
.foot .wrap { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 28px; padding-block: 48px calc(48px + env(safe-area-inset-bottom, 0px)); }
.foot b { color: var(--on-navy); display: block; margin-bottom: 8px; }
.foot .brand { color: var(--on-navy); margin-bottom: 12px; }
.foot .credit { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding-top: 22px; border-top: 1px solid var(--glass-line); color: var(--on-navy); font-weight: 600; }

.guide { position: fixed; z-index: 8; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; translate: -50% 0; width: min(640px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; background: color-mix(in srgb, var(--navy) 92%, transparent); color: var(--on-navy); border: 1px solid var(--glass-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: 0 20px 50px -18px rgb(0 0 0 / .6); font-size: .86rem; }
[dir="rtl"] .guide { padding: 10px 16px 10px 10px; }
.guide p { flex: 1; min-width: 0; }
.guide .short { display: none; font-weight: 700; }
.guide .x { border: 0; background: transparent; color: var(--on-navy-muted); width: 30px; height: 30px; border-radius: 8px; flex: none; }
.guide .x:hover { background: var(--glass); }

/* ---------- back office ---------- */
.app { display: grid; grid-template-columns: 252px 1fr; min-height: calc(100vh - 62px); }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); height: calc(100vh - 62px); background: var(--navy); color: var(--on-navy); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; overflow-x: hidden; overflow-y: auto; isolation: isolate; scrollbar-width: thin; }
.side::before { content: ""; position: absolute; z-index: -1; inset: auto -80px 0 auto; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--aur-1) 45%, transparent), transparent 65%); filter: blur(20px); }
.side .lbl { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--on-navy-muted); padding: 6px 12px; }
:lang(ar) .side .lbl { letter-spacing: 0; }
.nav-b { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; color: var(--on-navy-muted); text-align: start; padding: 11px 12px; border-radius: 12px; font-weight: 600; font-size: .92rem; transition: background .2s, color .2s; }
.nav-b:hover { background: var(--glass); color: var(--on-navy); }
.nav-b[aria-current="page"] { background: linear-gradient(135deg, color-mix(in srgb, var(--aur-1) 90%, transparent), color-mix(in srgb, var(--aur-1) 50%, transparent)); color: #fff; box-shadow: 0 10px 24px -12px var(--aur-1); }
.badge { margin-inline-start: auto; background: #F3B23E; color: #1A1204; font-size: .7rem; font-weight: 800; border-radius: 999px; padding: 1px 8px; }
.me { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-line); }
.me .av { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--aur-1), var(--aur-2)); display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; }
.me b { display: block; font-size: .88rem; color: var(--on-navy); }
.me span { font-size: .75rem; color: var(--on-navy-muted); }
.side-note { font-size: .74rem; color: var(--on-navy-muted); padding: 10px 12px 0; display: grid; gap: 6px; }
.side-note button { color: var(--grad-text-a); background: none; border: 0; padding: 0; text-align: start; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.main { min-width: 0; padding: 28px 30px 60px; display: grid; gap: 22px; align-content: start; }
.main-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.main-head h2 { font-size: clamp(1.5rem, 2.6vw, 2rem); font-weight: 800; letter-spacing: -.03em; }
:lang(ar) .main-head h2 { letter-spacing: 0; }
.main-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 4px; box-shadow: var(--shadow); position: relative; overflow: hidden; min-width: 0; }
.kpi .top-r { display: flex; justify-content: space-between; align-items: center; }
.kpi .k { font-size: .82rem; font-weight: 600; color: var(--muted); }
.kpi .v { font: 800 2rem/1.15 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.kpi .v small { font-size: .9rem; font-weight: 700; color: var(--muted); margin-inline-start: 4px; }
.kpi .s { font-size: .78rem; color: var(--muted); }
.kpi .ki { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.kpi.warn .ki { background: var(--warn-soft); color: var(--warn); }
.kpi.warn .v { color: var(--warn); }
.kpi.c .ki { background: var(--coral-soft); color: var(--coral); }
.kpi.aq .ki { background: var(--aqua-soft); color: var(--aqua); }
.bars { display: flex; align-items: end; gap: 4px; height: 38px; margin-top: 8px; }
.bars i { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--brand-soft); min-height: 3px; transform-origin: bottom; }
.bars i.hi { background: var(--brand); }
.kpi.aq .bars i { background: var(--aqua-soft); } .kpi.aq .bars i.hi { background: var(--aqua); }
.dash { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 6px; }
.panel-h h3 { font-size: 1.02rem; }
.panel-b { padding: 8px 20px 20px; }
.col { display: grid; gap: 20px; min-width: 0; }
.tl { display: grid; }
.tl-item { display: grid; grid-template-columns: 52px 22px 1fr; gap: 10px; align-items: stretch; }
.tl-time { font: 600 .82rem/1 var(--f-mono); color: var(--muted); padding-top: 18px; text-align: end; }
.tl-rail { position: relative; display: grid; justify-items: center; }
.tl-rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl-item:first-child .tl-rail::before { top: 20px; } .tl-item:last-child .tl-rail::before { bottom: calc(100% - 22px); }
.tl-dot { position: relative; margin-top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--line); }
.tl-item.done .tl-dot { background: var(--ok); border-color: var(--ok); }
.tl-item.noshow .tl-dot { background: var(--bad); border-color: var(--bad); }
.tl-item.now .tl-dot { background: var(--brand); border-color: var(--brand); }
.tl-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; margin-block: 3px; min-width: 0; flex-wrap: wrap; }
.tl-item.now .tl-card { background: var(--brand-soft); }
.tl-item.done .tl-card { opacity: .72; }
.who { min-width: 0; flex: 1; }
.who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .93rem; }
.who span { font-size: .8rem; color: var(--muted); }
.acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.now-tag { font-size: .7rem; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: .06em; }
.sn { font: 700 .72rem var(--f-mono); color: var(--coral); background: var(--coral-soft); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.av { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: hsl(var(--h, 170) 60% var(--av-bg)); color: hsl(var(--h, 170) 55% var(--av-fg)); }
.src { font-size: .7rem; font-weight: 700; color: var(--aqua); background: var(--aqua-soft); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.req { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.req:first-child { border-top: 0; }
.cure-row { display: grid; gap: 7px; padding: 12px 0; border-top: 1px solid var(--line); }
.cure-row:first-child { border-top: 0; }
.cure-row .top-r { display: flex; align-items: center; gap: 10px; }
.prog { height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--aur-1), var(--aur-2)); }
.meter { height: 10px; border-radius: 999px; background: var(--bad-soft); overflow: hidden; margin: 10px 0 8px; }
.meter i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ok), var(--brand)); }
.big-pct { font: 800 2.2rem/1 var(--f-display); }

/* agenda */
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-inline-end: 6px; }
.agenda-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.agenda { display: grid; grid-template-columns: 60px repeat(6, minmax(112px, 1fr)); grid-template-rows: auto; grid-auto-rows: 42px; min-width: 780px; position: relative; }
.agenda .h { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: center; font-size: .8rem; font-weight: 700; z-index: 3; text-transform: capitalize; }
.agenda .h b { display: block; font: 800 1.25rem/1.2 var(--f-display); }
.agenda .h.today b { color: var(--brand-ink); background: var(--brand); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; margin: 2px auto 0; font-size: 1rem; }
.agenda .t { font: 500 .7rem var(--f-mono); color: var(--muted); padding: 3px 8px; text-align: end; translate: 0 -8px; }
.agenda .c { border: 0; border-top: 1px solid var(--line); border-inline-start: 1px solid var(--line); background: transparent; padding: 0; }
.agenda .c.half { border-top-style: dashed; border-top-color: color-mix(in srgb, var(--line) 60%, transparent); }
.agenda .c.closed { background: repeating-linear-gradient(135deg, var(--sunk) 0 5px, transparent 5px 11px); cursor: default; }
.agenda .c:not(.closed):hover { background: var(--brand-soft); }
.appt { margin: 2px 4px; border-radius: 10px; padding: 5px 8px; font-size: .74rem; line-height: 1.3; text-align: start; border: 0; border-inline-start: 3px solid currentColor; overflow: hidden; z-index: 2; min-width: 0; transition: transform .15s, box-shadow .15s; }
.appt:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.appt b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 700; }
.appt span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.appt.s-confirmed { background: var(--brand-soft); color: var(--brand); }
.appt.s-pending { background: var(--warn-soft); color: var(--warn); }
.appt.s-done { background: var(--ok-soft); color: var(--ok); }
.appt.s-noshow { background: var(--bad-soft); color: var(--bad); }
.nowline { position: absolute; height: 2px; background: var(--bad); z-index: 4; pointer-events: none; }
.nowline::before { content: ""; position: absolute; inset-inline-start: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }

/* patients */
.pt-grid { display: grid; grid-template-columns: 310px 1fr; gap: 20px; align-items: start; }
.search { position: relative; }
.search svg { position: absolute; inset-inline-start: 12px; top: 50%; translate: 0 -50%; color: var(--muted); }
.search .in { padding-inline-start: 38px; }
.pt-list { max-height: 680px; overflow-y: auto; padding: 6px; }

    case "bk-time": ui.bk.time = v; renderBook(); $("#bkName")?.focus({ preventScroll: true }); break;
    case "bk-rx": ui.bk.rx = v; renderBook(); break;
    case "bk-reset": ui.bk = { service: null, date: null, time: null, rx: null, zone: null, done: null }; renderBook(); break;
    case "go-requests": go("cabinet", "requests"); break;
    case "guide-x": ui.guide = false; try { localStorage.setItem(KEY + "-guide", "0"); } catch {} el.closest(".guide").remove(); break;
    case "tab": ui.tab = v; ui.anim = true; render(); window.scrollTo({ top: 0 }); break;
    case "week": ui.week = v === "0" ? 0 : ui.week + Number(v); render(); break;
    case "remind": { const tm = ymd(addDays(new Date(), 1)); const n = S.appts.filter(a => a.date === tm && a.status === "confirmed").length; toast(n ? t("reminded", { n }) : t("remindNone")); break; }
    case "set-st": { const a = S.appts.find(x => x.id === id); a.status = v; save(); closeModal(); render(); toast(v === "cancelled" ? t("cancelled") : t("updated")); break; }
    case "refuse": { const a = S.appts.find(x => x.id === id); a.status = "cancelled"; save(); render(); toast(t("refused")); break; }
    case "accept": { const a = S.appts.find(x => x.id === id); a.status = "confirmed"; save(); closeModal(); render(); toast(t("accepted")); break; }
    case "new-appt": newApptModal(el.dataset.d || bookingDays(1)[0], el.dataset.t); break;
    case "new-series": newApptModal(bookingDays(1)[0], null, v); break;
    case "open-appt": apptModal(id); break;
    case "open-file": closeModal(); ui.sel = v; ui.q = ""; go("cabinet", "patients"); break;
    case "close": closeModal(); break;
    case "save-appt": {
      let pid = $("#mPt").value; const name = $("#mName").value.trim(), ph = normPhone($("#mPhone").value);
      if (!pid) { if (name.length < 3) return showErr("#mErr", t("needName")); if (ph.length !== 8) return showErr("#mErr", t("needPhone")); pid = findOrCreate(name, ph).id; }
      const time = $("#mTime").value; if (!time) return showErr("#mErr", t("noSlot"));
      const count = Number($("#mCount").value), made = scheduleSeries(pid, $("#mSvc").value, $("#mDate").value, time, count, Number($("#mFreq").value));
      save(); closeModal(); render();
      toast(made.length > 1 ? t("addedSeries", { n: made.length, d: fmtDay(made[made.length - 1].date, { day: "numeric", month: "long" }) }) : t("added"));
      break;
    }
    case "new-pt": newPatientModal(); break;
    case "save-pt": {
      const name = $("#nName").value.trim(), ph = normPhone($("#nPhone").value), born = Number($("#nBorn").value) || 1990;
      if (name.length < 3) return showErr("#nErr", t("needName")); if (ph.length !== 8) return showErr("#nErr", t("needPhone"));
      const p = findOrCreate(name, ph); p.born = born; save(); closeModal(); ui.sel = p.id; ui.q = ""; render(); toast(t("pCreated")); break;
    }
    case "sel-pt": ui.sel = v; render(); break;
    case "send-ex": toast(t("exSent")); break;
    case "save-notes": { const p = patient(v); p.notes = $("#ptNotes").value; save(); toast(t("saved")); break; }
    case "reset": S = seed(); save(); ui.sel = null; ui.bk = { service: null, date: null, time: null, rx: null, zone: null, done: null }; ui.anim = true; render(); toast(t("resetDone")); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#layer").innerHTML) closeModal();
  const z = e.target.closest && e.target.closest(".zone");
  if (z && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); setZone(z.dataset.v); }
});
if (!reduced && !SHOT) setInterval(() => { if (ui.view !== "site" || document.hidden) return; ui.phase = (ui.phase + 1) % 8; applyPhase(); }, 1250);
render();
})();
</script>
</body>
</html>
